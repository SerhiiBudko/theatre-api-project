version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=theatre.settings
    depends_on:
      - db
    command: >
      sh -c "python manage.py migrate &&
             python manage.py create_sample_data &&
             python manage.py runserver 0.0.0.0:8000"

  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=theatre_db
      - POSTGRES_USER=theatre_user
      - POSTGRES_PASSWORD=theatre_password
    ports:
      - "5432:5432"

volumes:
  postgres_data: 